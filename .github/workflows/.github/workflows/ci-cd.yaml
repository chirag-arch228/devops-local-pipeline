name: DevOps Portfolio Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Verify Cluster & Nodes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy App, Observability & Alerts
        run: |
          kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace devops-prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f app-deployment.yaml
          kubectl apply -f dashboard-config.yaml
          kubectl apply -f dashboard-provider.yaml
          kubectl apply -f grafana.yaml
          kubectl apply -f prometheus-alerts.yaml
