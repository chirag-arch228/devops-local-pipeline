apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo
  namespace: devops-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-demo
  template:
    metadata:
      labels:
        app: devops-demo
    spec:
      containers:
        - name: python-app
          image: python:3.9-slim
          command: ["python", "-c"]
          args:
            - |
              from http.server import HTTPServer, BaseHTTPRequestHandler
              import prometheus_client
              import time
              
              REQUEST_COUNT = prometheus_client.Counter('http_requests_total', 'Total HTTP Requests')
              
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      REQUEST_COUNT.inc()
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"Hello from FinacPlus DevOps Portfolio App!")
                      
              prometheus_client.start_http_server(80)
              server = HTTPServer(('0.0.0.0', 8080), Handler)
              server.serve_forever()
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo-service
  namespace: devops-prod
spec:
  selector:
    app: devops-demo
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
