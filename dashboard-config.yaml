apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  app-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "Total HTTP Requests",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "P582969A645100000"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "P582969A645100000"
              },
              "expr": "http_requests_total",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        }
      ],
      "title": "DevOps Microservice Dashboard",
      "refresh": "5s",
      "schemaVersion": 38,
      "time": {
        "from": "now-15m",
        "to": "now"
      }
    }
