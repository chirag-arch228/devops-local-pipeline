apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: observability
data:
  alert.rules.yaml: |
    groups:
      - name: devops-portfolio-alerts
        rules:
          - alert: InstanceDown
            expr: up{job="devops-demo-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Instance {{ .instance }} down"
              description: "The Python microservice has been down for more than 1 minute."
